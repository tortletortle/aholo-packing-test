<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>奇货寄运铺</title>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <aside id="panel">
        <h1 id="title">奇货寄运铺</h1>
        <div id="gold" class="gold"></div>

        <!-- order flow (default mode) -->
        <section id="flow"></section>

        <section id="packing-ui">
          <p class="hint" id="key-help">
            点击货物 · WASD/方向键移动一格 · R 旋转90° · Enter 放下 · Esc 取消<br />
            已放的货物可以再点一次取出重摆
          </p>
          <h2>货物</h2>
          <ul id="item-list"></ul>
          <h2>状态</h2>
          <div id="status" role="status" aria-live="polite"></div>
        </section>

        <!-- sandbox tools (?mode=sandbox) -->
        <section id="sandbox-tools">
          <h2>已验证示例</h2>
          <button type="button" id="btn-demo">载入两层示例布局</button>
          <button type="button" id="btn-showcase">载入四件模型示例</button>
        </section>

        <h2>显示</h2>
        <button type="button" id="btn-cells">已放物品：显示占格线（C）</button>
        <button type="button" id="btn-fit">贴合：真实比例（F）</button>
        <button type="button" id="btn-view">视角：斜俯视（V 切换）</button>
        <div id="model-status" class="hint"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
